name: Agent NFT simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent-nft/**'
      - '.github/workflows/agent-nft-simulation.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-nft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-nft/package-lock.json
      - run: npm install
      - run: npm run simulate
